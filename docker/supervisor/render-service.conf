[program:render-service]
command=python3 /opt/daz-cloud-render/render_service.py
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"

[program:watchdog]
command=python3 /opt/daz-cloud-render/watchdog.py
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONUNBUFFERED="1"
