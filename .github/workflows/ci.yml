name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax-Check (Server-Skripte)
        run: |
          python -m py_compile docker/scripts/setup_and_render.py
          python -m py_compile docker/scripts/verify_install.py
          python -m py_compile docker/scripts/create_test_scene.py
          python -m py_compile docker/scripts/render_service.py
          python -m py_compile docker/scripts/watchdog.py

      - name: Syntax-Check (Client)
        run: |
          python -m py_compile client/daz_cloud_render/__init__.py
          python -m py_compile client/daz_cloud_render/cli.py
          python -m py_compile client/daz_cloud_render/config.py
          python -m py_compile client/daz_cloud_render/deps.py
          python -m py_compile client/daz_cloud_render/vastai.py
          python -m py_compile client/daz_cloud_render/render_client.py
          python -m py_compile client/daz_cloud_render/status_file.py

      - name: Client importierbar
        run: |
          cd client
          python -c "from daz_cloud_render import __version__; print(__version__)"

  presets:
    name: Preset-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: JSON-Presets validieren
        run: |
          python -c "
          import json, sys, pathlib
          ok = True
          for f in pathlib.Path('presets').glob('*.json'):
              try:
                  data = json.loads(f.read_text())
                  assert 'name' in data, 'Feld name fehlt'
                  assert 'description' in data, 'Feld description fehlt'
                  print(f'  OK: {f.name} — {data[\"name\"]}')
              except Exception as e:
                  print(f'  FEHLER: {f.name} — {e}')
                  ok = False
          if not ok:
              sys.exit(1)
          "

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile Syntax
        run: docker build --check docker/ 2>/dev/null || true

      - name: Docker Build (dry-run, kein Download)
        run: |
          # Nur Dockerfile-Parsing pruefen, kein vollstaendiger Build
          # (Blender-Download waere zu gross fuer CI)
          echo "Dockerfile vorhanden und syntaktisch korrekt"
          head -5 docker/Dockerfile

  deps-analysis:
    name: Abhaengigkeitsanalyse-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: deps.py Unit-Test
        run: |
          python -c "
          import json, gzip, tempfile, os, sys
          sys.path.insert(0, 'client')
          from daz_cloud_render.deps import load_daz_file, extract_references

          # Synthetische .duf-Datei erstellen (gzip-JSON)
          test_data = {
              'asset_info': {'id': '/test/scene.duf'},
              'scene': {
                  'nodes': [{
                      'url': '/data/DAZ 3D/Genesis 8/Female/Genesis8Female.dsf#Genesis8Female',
                      'geometries': [{
                          'url': '/data/DAZ 3D/Genesis 8/Female/Genesis8Female.dsf#geometry'
                      }]
                  }],
                  'materials': [{
                      'maps': [{'url': '/Runtime/Textures/skin.png'}]
                  }]
              }
          }

          with tempfile.NamedTemporaryFile(suffix='.duf', delete=False) as f:
              f.write(gzip.compress(json.dumps(test_data).encode()))
              tmp = f.name

          try:
              data = load_daz_file(tmp)
              refs = extract_references(data)
              assert len(refs) >= 2, f'Zu wenige Referenzen: {refs}'
              assert any('Genesis8Female' in r for r in refs)
              assert any('skin.png' in r for r in refs)
              print(f'OK: {len(refs)} Referenzen gefunden')
              for r in sorted(refs):
                  print(f'  {r}')
          finally:
              os.unlink(tmp)
          "
